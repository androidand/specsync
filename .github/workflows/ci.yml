name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Enforce OpenSpec archive hygiene
        run: go run ./cmd/specsync release-plan -fail-on-archive-candidates
      - name: Enforce changelog commit linking
        run: go run ./cmd/specsync changelog -resolve-refs
      - name: Enforce task-dogfooding hygiene
        run: go run ./cmd/specsync audit-tasks -fail-on-mismatch
      - name: Validate OpenSpec change structure
        run: go run ./cmd/specsync validate
